name: Supabase Activity Ping

on:
  schedule:
    - cron: '0 0 */3 * *' # 每 3 天 UTC 00:00 执行一次
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发

jobs:
  ping-project:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # 调用 Data API 根路径并携带 publishable key，真正触达数据库以重置 7 天暂停倒计时
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/")

          echo "Supabase URL: $SUPABASE_URL"
          echo "HTTP Status: $response"

          if [ "$response" -ne 200 ]; then
            echo "Failed to ping Supabase project."
            exit 1
          fi

          echo "Supabase project pinged successfully!"
